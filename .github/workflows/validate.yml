name: Offline Lab Parser Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run lab interpretation tests
        run: python -m unittest discover -s tests -v
      - name: Parse Persian soil fixture
        run: |
          python - <<'PY'
          import json
          from engine import analyze
          report = """pH ۷٫۳۴
          کربن آلی ۰٫۸۲ %
          فسفر ۵۳٫۲۸ mg/kg
          پتاسیم ۸۶۰ mg/kg
          روی ۳٫۴۴ mg/kg
          آهن ۱٫۱۸ mg/kg
          مس ۰٫۶۴ mg/kg
          منگنز ۱٫۸۸ mg/kg
          """
          result=analyze(report,kind='soil',source='transcribed_soil_fixture')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result['row_count'] >= 6, "too few recognized fixture rows"
          assert result['use_in_calculation_allowed'] is False
          PY
